<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前端课程墙</title>
  <!-- 引入外部样式表 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== 页面头部：Logo + 导航 ========== -->
  <header>
    <a href="#" class="logo">前端课程墙</a>
    <nav>
      <a href="#">全部课程</a>
      <a href="#">关于</a>
    </nav>
  </header>

  <!-- ========== 主要内容区 ========== -->
  <main>
    <h1>全部课程</h1>

    <!-- 课程列表 -->
    <section class="course-list">

      <!-- 课程 1 -->
      <article class="course-item">
        <div class="course-info">
          <h2>HTML入门</h2>
          <p>结构与语义，页面一切的起点。</p>
        </div>
        <a href="#" class="course-link">查看详情</a>
      </article>

      <!-- 课程 2 -->
      <article class="course-item">
        <div class="course-info">
          <h2>CSS布局</h2>
          <p>Flex\Grid与响应式设计。</p>
        </div>
        <a href="#" class="course-link">查看详情</a>
      </article>

      <!-- 课程 3 -->
      <article class="course-item">
        <div class="course-info">
          <h2>JavaScript基础</h2>
          <p>让页面动起来的第一门语言。</p>
        </div>
        <a href="#" class="course-link">查看详情</a>
      </article>

    </section>
  </main>

  <!-- ========== 页面底部 ========== -->
  <footer>
    <p>课程底案例·纯CSS版</p>
  </footer>

</body>
</html>
